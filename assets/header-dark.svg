<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Eyüp Duran — Software Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.55" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <linearGradient id="acv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.27999999999999997"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1F2937" stroke-width="1"/></pattern>
  <mask id="fade"><rect width="1200" height="330" fill="url(#fm)"/></mask>
  <linearGradient id="fm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.05"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/></linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="328" rx="22"/></clipPath>
</defs>
<style>
  .sans{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
  .b{fill:url(#acv);transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite alternate}
  @keyframes wave{0%{transform:scaleY(.25);opacity:.55}100%{transform:scaleY(1);opacity:1}}
  .in{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
  .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .dot{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .orb{animation:drift 9s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(-40px,18px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#grid)" mask="url(#fade)"/>
  <circle class="orb" cx="930" cy="120" r="260" fill="url(#g1)"/>
  <circle class="orb" cx="1080" cy="280" r="200" fill="url(#g2)" style="animation-delay:-4s"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#ac)"/>
</g>
<rect x="1" y="1" width="1198" height="328" rx="22" fill="none" stroke="#263044"/>

<g class="in d1"><text x="64" y="78" class="mono" font-size="15" fill="#6B7280">~/eyupduran <tspan fill="#22D3EE">❯</tspan> whoami</text></g>
<g class="in d2"><text x="62" y="150" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-1.5">Eyüp Duran</text></g>
<g class="in d3"><text x="64" y="192" class="sans" font-size="24"><tspan font-weight="600" fill="url(#ac)">Software Engineer</tspan><tspan font-weight="400" fill="#9CA3AF">  ·  full-stack, realtime &amp; AI</tspan></text></g>
<g class="in d4">
  <rect x="64" y="222" width="115" height="32" rx="16" fill="#111827" stroke="#263044"/><text x="121.5" y="243" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#9CA3AF">Go backends</text><rect x="189" y="222" width="148" height="32" rx="16" fill="#111827" stroke="#263044"/><text x="263" y="243" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#9CA3AF">Voice AI agents</text><rect x="347" y="222" width="180" height="32" rx="16" fill="#111827" stroke="#263044"/><text x="437" y="243" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#9CA3AF">Web · iOS · Android</text><rect x="537" y="222" width="107" height="32" rx="16" fill="#111827" stroke="#263044"/><text x="590.5" y="243" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#9CA3AF">3D &amp; games</text><rect x="654" y="222" width="115" height="32" rx="16" fill="#111827" stroke="#263044"/><text x="711.5" y="243" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#9CA3AF">Multiplayer</text>
</g>
<g class="in d5"><text x="64" y="292" class="mono" font-size="15" fill="#6B7280">$ build --realtime --ai --everywhere<tspan class="cur" fill="#22D3EE"> ▍</tspan></text></g>

